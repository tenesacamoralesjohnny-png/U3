<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>CSS Styling Methods</title>

    <!-- External stylesheet -->
    <link rel="stylesheet" href="styles.css">

    <!-- Embedded style -->
    <style>
        .world {
            color: green;
        }
    </style>
</head>
<body>

    <!-- Inline style -->
    <h1 style="color: red;">Hello</h1>

    <!-- Embedded style -->
    <h1 class="world">World</h1>

    <!-- External style -->
    <h1 class="welcome">Welcome</h1>

</body>
</html>
