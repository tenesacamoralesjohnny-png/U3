<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Module 9 – Table Assignment</title>
    <style>
        table {
            width: 60%;
            margin: 20px auto;
            border-collapse: collapse;
            text-align: center;
            font-family: Arial, sans-serif;
        }
        th, td {
            border: 2px solid #333;
            padding: 10px;
        }
        th {
            background-color: #4CAF50;
            color: white;
        }
        caption {
            caption-side: top;
            font-size: 24px;
            margin-bottom: 15px;
        }
    </style>
</head>
<body>

    <table>
        <caption>Module 9 – Sample Table</caption>
        <tr>
            <th>Day</th>
            <th>Breakfast</th>
            <th>Lunch</th>
            <th>Dinner</th>
        </tr>
        <tr>
            <td>Day One</td>
            <td>Eggs</td>
            <td>Grilled Cheese</td>
            <td>Grilled Burgers</td>
        </tr>
        <tr>
            <td>Day Two</td>
            <td>Pancakes</td>
            <td>Soup</td>
            <td>Baked Ziti</td>
        </tr>
        <tr>
            <td>Day Three</td>
            <td>French Toast</td>
            <td>Steak Tartare</td>
            <td>Massimo Capra Chicken</td>
        </tr>
    </table>

</body>
</html>
