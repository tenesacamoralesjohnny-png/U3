<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Color Formats</title>

<style>
  /* Fade using RGBA (step .1) */
  .fade01 { color: rgba(255, 102, 26, 1); }
  .fade02 { color: rgba(255, 102, 26, .9); }
  .fade03 { color: rgba(255, 102, 26, .8); }
  .fade04 { color: rgba(255, 102, 26, .7); }
  .fade05 { color: rgba(255, 102, 26, .6); }
  .fade06 { color: rgba(255, 102, 26, .5); }
  .fade07 { color: rgba(255, 102, 26, .4); }
  .fade08 { color: rgba(255, 102, 26, .3); }
  .fade09 { color: rgba(255, 102, 26, .2); }
  .fade10 { color: rgba(255, 102, 26, .1); }

  /* HSL white to black (10% steps) */
  .hsl100 { color: hsl(0, 0%, 100%); }
  .hsl90  { color: hsl(0, 0%, 90%); }
  .hsl80  { color: hsl(0, 0%, 80%); }
  .hsl70  { color: hsl(0, 0%, 70%); }
  .hsl60  { color: hsl(0, 0%, 60%); }
  .hsl50  { color: hsl(0, 0%, 50%); }
  .hsl40  { color: hsl(0, 0%, 40%); }
  .hsl30  { color: hsl(0, 0%, 30%); }
  .hsl20  { color: hsl(0, 0%, 20%); }
  .hsl10  { color: hsl(0, 0%, 10%); }
  .hsl0   { color: hsl(0, 0%, 0%); }
</style>
</head>

<body>

<h1 style="color: rgb(255,102,26);">
RGB 100%,40%,10%
</h1>

<p style="color: rgba(255,102,26,.5);">
RGBA 100%,40%,10%,.5
</p>

<h1 style="color: hsl(370,100%,50%);">
HSL 370,100%,50%
</h1>

<p style="color: hsla(370,100%,50%,.5);">

</p>
