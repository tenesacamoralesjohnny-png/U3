<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Navigation</title>
<link rel="icon" href="favicon.ico">
<!---[if lte IE 7]>
<script type="text/javascript"
src="js/IE Drop-Down.js"></script>
<![end if]-->
<style>
div#nav ul{
padding:0;
margin:0;
background-color:#ebebeb;
}
div#nav ul li{
float:left;
list-style:none;
padding:0;
}
div#nav ul li a{
padding:7px 15px;
display:block;
text-decoration:none;
color:#333;
border-right: 2px solid #cfcfcf;
}
div#nav ul ul {
position:absolute;
left:-999em;
}
div#nav ul li:hover ul,
div#nav ul li.sfhover ul{
left:auto;
}
div#nav ul li ul li{
float:none;
}
div#nav ul li ul li a{
border-right:none;
}
div#nav ul li a:hover,
div#nav ul li:hover a,
div#nav ul li.sfhover a{
background-color:#FFF;
}
div#nav ul li:hover ul li a,
div#nav ul li.sfhover ul li a{
background-color:#ebebeb;
}
div#nav ul li:hover ul li a:hover,
div#nav ul li.sfhover ul li a:hover{
background-color:#FFF;
}
div#nav ul li.last a{
border-right:none;
}
.clearfix:after{
content:".";
display:block;
height:0;
clear:both;
visibility:hidden;
}
.clearfix{
display:inline-block;
}
/* Hides from IE-Mac\*/
*html.clearfix{
height:1%;
}
.clearfix{
display:block;
}
/* End hide from IE-Mac */
/* Fix for sticky IE hover */
div#nav ul li:hover, div#nav ul li.sfhover{
position:static;
}
</style>
</head>
<body>
<div id="nav">
<ul class="clearfix">
<li><a
href="https://tenesacamoralesjohnny-png.github.io/U3/texting.html">texting</a>
<ul>
<li><a
href="https://tenesacamoralesjohnny-png.github.io/U3/section.html">Section</a></li>
<li><a
href="https://tenesacamoralesjohnny-png.github.io/U3/select.html">select</a></li>
<li><a
href="https://tenesacamoralesjohnny-png.github.io/U3/seletin.html">seletin</a></li>
<li><a
href="https://tenesacamoralesjohnny-png.github.io/U3/bar.html">Space</a></li>
<li><a
href="http://www.mrmclaughlin.com/WD2015dobsonstephanie/Unit%203/Module%205/
inlineText.html">Inline Text</a></li>
<li><a
href="https://tenesacamoralesjohnny-png.github.io/U3/font.html">Div & Span</a></li>
</ul>
</div>
</body>
</html>
